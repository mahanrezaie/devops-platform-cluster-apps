argo-cd:
  configs:
    params:
      server.insecure: true
    cm:
      url: http://argocd.homelab
      exec.enabled: true
      params:
        server.enable.gzip: true

  server:
    replicas: 1
    ingress:
      # -- Enable an ingress resource for the Argo CD server
      enabled: true
      # -- Additional ingress annotations

      # -- Additional ingress labels
      labels: {}
      # -- Defines which ingress controller will implement the resource
      # -- If empty, if any ingress controller is marked as default, it will be used
      ingressClassName: "traefik"

      hosts:
      - argocd.si1.automobile.sanaap.co

      paths:
      - /
      pathType: ImplementationSpecific
      # -- Additional ingress paths
      extraPaths: []
      tls: false

      # -- Uses `server.service.servicePortHttps` instead `server.service.servicePortHttp`
      https: false
  redis-ha:
    enabled: false
    image:
      repository: docker.io/redis
    haproxy:
      image:
        repository: docker.io/haproxy
  redis:
    resources: 
      limits:
        cpu: 200m
        memory: 128Mi
      requests:
        cpu: 200m
        memory: 128Mi
    tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
    nodeSelector:
      node-role.kubernetes.io/control-plane: ""


  controller:
    replicas: 1
    resources:
      limits:
        cpu: 300m
        memory: 500Mi
      requests:
        cpu: 300m
        memory: 500Mi
    tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"
    nodeSelector:
      node-role.kubernetes.io/control-plane: ""


  repoServer:
    replicas: 1
    resources:
      limits:
        cpu: 200m
        memory: 128Mi
      requests:
        cpu: 200m
        memory: 128Mi
    tolerations:
     - key: "node-role.kubernetes.io/control-plane"
       operator: "Exists"
       effect: "NoSchedule"
    nodeSelector:
      node-role.kubernetes.io/control-plane: ""


  applicationSet:
    replicas: 1
    resources:
      limits:
        cpu: 200m
        memory: 128Mi
      requests:
        cpu: 200m
        memory: 128Mi

  global:
    env:
      - name: HTTP_PROXY
        value: http://192.168.1.8:1081
      - name: HTTPS_PROXY
        value: http://192.168.1.8:1081
      - name: http_proxy
        value: http://192.168.1.8:1081
      - name: https_proxy
        value: http://192.168.1.8:1081
      - name: NO_PROXY
        value: argocd-repo-server,argocd-application-controller,argocd-metrics,argocd-server,argocd-server-metrics,argocd-redis,argocd-redis-ha-haproxy,argocd-dex-server,localhost,10.0.0.0/8,*.ir
