kube-prometheus-stack:
  defaultRules:
    create: true

  alertmanager:
    config:
      global:
        resolve_timeout: 5m
      inhibit_rules:
      - source_matchers:
        - 'severity = critical'
        target_matchers:
        - 'severity =~ warning|info'
        equal:
        - 'namespace'
        - 'alertname'
      - source_matchers:
        - 'severity = warning'
        target_matchers:
        - 'severity = info'
        equal:
        - 'namespace'
        - 'alertname'
      - source_matchers:
        - 'alertname = InfoInhibitor'
        target_matchers:
        - 'severity = info'
        equal:
        - 'namespace'
      route:
        group_by: ['...']
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 12h
        receiver: 'null'
        routes:
        - receiver: 'null'
          continue: true
        - receiver: 'telegram-devops-platform-critical-alerts'
          matchers:
          - destination = "telegram"
          group_by: ['...']
          repeat_interval: 1h
      receivers:
      - name: 'null'
      - name: 'telegram-devops-platform-critical-alerts'
        telegram_configs:
        - bot_token: "-100"
          api_url: https://api.telegram.org
          chat_id: -100
          parse_mode: 'Markdown'
          message: '{{ template "telegram.message" . }}'
          http_config:
            proxy_url: 'http://192.168.1.8:1081'

      templates:
      - '/etc/alertmanager/config/*.tmpl'


    ## Alertmanager template files to format alerts
    templateFiles:
      telegram_template.tmpl: |-

        {{ define "telegram.message" }}
        {{ range .Alerts.Firing }}
        🚨 {{ .Labels.alertname }}
        
        Severity: {{ .Labels.severity }}
        
        {{ if .Annotations.summary }}
        Summary: {{ .Annotations.summary }}
        {{ end }}
        
        {{ if .Annotations.description }}
        Description:
        {{ .Annotations.description }}
        {{ end }}
        
        Node: {{ .Labels.node }}
        {{ if .Labels.namespace }}
        Namespace: {{ .Labels.namespace }}
        {{ end }}
        
        ---
        {{ end }}
        
        {{ range .Alerts.Resolved }}
        ✅ RESOLVED: {{ .Labels.alertname }}
        
        Node: {{ .Labels.node }}
        
        ---
        {{ end }}
        {{ end }}

    ingress:
      enabled: false
    alertmanagerSpec:
      storage:
      volumeClaimTemplate:
        spec:
          storageClassName: topolvm-provisioner
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 1Gi
          selector: {}
      resources:
        requests:
          cpu: 50m
          memory: 50Mi
        limits:
          cpu: 500m
          memory: 500Mi

  grafana:
    enabled: true
    namespaceOverride: ""

    defaultDashboardsTimezone: Asia/Tehran

    admin:
      existingSecret: "grafana-auth"
      userKey: admin-user
      passwordKey: admin-password

    ingress:
      enabled: true
      ingressClassName: traefik

      hosts:
      - grafana.local

    sidecar:
      datasources:
        createPrometheusReplicasDatasources: true
    
    persistence:
      enabled: true
      size: 500Mi
      storageClassName: topolvm-provisioner

  ## Manages Prometheus and Alertmanager components
  ##
  prometheusOperator:
    enabled: true
    resources:
      limits:
        cpu: 100m
        memory: 200Mi
      requests:
        cpu: 10m
        memory: 50Mi

  prometheus-node-exporter:
    tolerations:
    - effect: NoSchedule
      operator: Exists
    - effect: NoExecute
      operator: Exists

  ## Deploy a Prometheus instance
  prometheus:
    enabled: true

    prometheusSpec:

      replicas: 1

      retention: 12h
      retentionSize: "2GiB"

      externalLabels:
        org: devops-platform
        region: homelab
        cluster: test

      resources:
        requests:
          memory: 250Mi
          cpu: 250m
        limits:
          memory: 1Gi
          cpu: 1

      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: topolvm-provisioner
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 4Gi
  thanosRuler:
    enabled: false

  ## Setting to true produces cleaner resource names, but requires a data migration because the name of the persistent volume changes. Therefore this should only be set once on initial installation.
  ##
  cleanPrometheusOperatorObjectNames: true

  kubeEtcd:
    enabled: false
    serviceMonitor:
      enabled: true

      scheme: http
      insecureSkipVerify: false
      serverName: "localhost"
