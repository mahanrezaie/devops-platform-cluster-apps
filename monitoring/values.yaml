
prometheus:

  server:
    retention: 6h

    persistentVolume:
      enabled: true
      storageClass: topolvm
      size: 10Gi

    resources:
      requests:
        memory: 200Mi
        cpu: 100m
      limits:
        memory: 450Mi

    serverFiles:

      alerting_rules.yml:
        groups:
          - name: node-alerts
            rules:

              - alert: NodeDown
                expr: up == 0
                for: 1m
                labels:
                  severity: critical
                annotations:
                  summary: "Node is down"

              - alert: HighCPUUsage
                expr: 100 - (avg by(instance)(rate(node_cpu_seconds_total{mode="idle"}[2m])) * 100) > 80
                for: 2m
                labels:
                  severity: warning
                annotations:
                  summary: "High CPU usage on node"

              - alert: HighMemoryUsage
                expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
                for: 2m
                labels:
                  severity: warning
                annotations:
                  summary: "High memory usage"

              - alert: DiskAlmostFull
                expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) * 100 < 15
                for: 2m
                labels:
                  severity: critical
                annotations:
                  summary: "Disk almost full"

  prometheus-pushgateway:
    ## If false, pushgateway will not be installed
    ##
    enabled: false
  alertmanager:
    enabled: true
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 100m
        memory: 128Mi

    persistentVolume:
      enabled: true
      storageClass: topolvm
      size: 2Gi

    config:
      route:
        receiver: default

      receivers:
        - name: default


  nodeExporter:
    enabled: true

    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule

      - key: node.kubernetes.io/memory-pressure
        operator: Exists
        effect: NoSchedule


  kubeStateMetrics:
    enabled: true


grafana:

  enabled: true

  persistence:
    enabled: true
    storageClass: topolvm
    size: 2Gi

  resources:
    requests:
      memory: 300Mi
      cpu: 50m
    limits:
      memory: 300Mi

  ingress:
    enabled: true

    ingressClassName: traefik

    hosts:
      - grafana.local

    path: /

    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: web

    tls: []
  adminPassword: admin

  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          url: http://prometheus-server
          access: proxy
          isDefault: true
