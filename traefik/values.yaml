traefik:
  providers:
    kubernetesIngress:
      ingressClass: traefik
  additionalArguments:
  - "--providers.kubernetesingress.ingressendpoint.ip=192.168.1.8"
  ports:
    web:
      nodePort: 31080
      port: 80
      forwardedHeaders:
        trustedIPs:
          - 192.168.1.8
      proxyProtocol:
        trustedIPs:
          - 192.168.1.8
      transport:
        respondingTimeouts:
          readTimeout: 0
          writeTimeout: 0
          idleTimeout: 0

    websecure:
      nodePort: 31443
      port: 443
      tls:
        enabled: true
      forwardedHeaders:
        trustedIPs:
        - 192.168.1.8
      proxyProtocol:
        trustedIPs:
        - 192.168.1.8
      transport:
        respondingTimeouts:
          readTimeout: 0
          writeTimeout: 0
          idleTimeout: 0
    metrics:
      port: 20091
  service:
    single: false
    type: NodePort
  deployment:
    kind: DaemonSet
  hostNetwork: true
  securityContext:
    capabilities:
      drop: [ALL]
      add: [NET_BIND_SERVICE]
    readOnlyRootFilesystem: true
    runAsGroup: 0
    runAsNonRoot: false
    runAsUser: 0
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 250m
      memory: 256Mi


